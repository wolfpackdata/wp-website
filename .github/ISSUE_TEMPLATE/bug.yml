name: Bug
description: Something is broken or behaving incorrectly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Filing a bug. It will be labeled `bug` automatically. If it **blocks a core
        workflow or risks data loss**, also add the `critical` label after creating.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behavior, including any error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, versions, data set, or anything else relevant to reproducing.
    validations:
      required: false
