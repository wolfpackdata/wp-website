    </filter>
    <clipPath id="shieldclip"><path d="M 710 260 Q 710 205 770 205 L 1330 205 Q 1390 205 1390 260 L 1390 590 Q 1390 820 1050 1000 Q 710 820 710 590 Z"/></clipPath>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
