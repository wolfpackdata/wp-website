      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="30%" stop-color="#C2CEEC"/>
      <stop offset="55%" stop-color="#DDE6FA"/>
      <stop offset="100%" stop-color="#96A6CE"/>
    </linearGradient>
