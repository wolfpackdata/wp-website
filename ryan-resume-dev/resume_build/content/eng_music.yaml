      - >-
        AI engineer, data scientist, software developer, technology operator, and
        professional musician with 20+ years of coding experience and 17 years
        leading technology, analytics, and operational initiatives. Combines deep
        expertise in software architecture, Python development, SQL, cloud
        analytics, financial modeling, automation, and systems design with modern
        AI development workflows using Claude Code, OpenAI Codex, ChatGPT, and
        GitHub Copilot — alongside 36 years at the piano and 23 years paid to
        perform, spanning studio production, sound design, and professional DJ
        work since 2009, which makes him a practitioner in the domain rather
        than a visitor to it.
      - >-
        Known for designing and delivering production-ready software, internal
        tools, workflow automation, and decision-support systems through
        AI-accelerated development practices. COO and partner of an eight-figure
        e-commerce brand through its climb from $300K to $30M, and head of
        insights & analytics at an AI SaaS company where the quantitative platform
        he built became a $20k-MRR product; financial modeling and forecasting
        run through every role since 2009, so solutions get designed with the P&L
        in mind. Now focused on AI engineering as its own discipline — building
        agentic systems and shipping public software.

