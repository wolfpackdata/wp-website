# =============================================================================
# eng-only — engineering résumé for non-music companies
#
# Sibling of eng_music.yaml. Built from the v2 round plan (docs/v2-plan.md).
#
# Music is reduced to subtle depth, not hidden: no music sections, no Music
# Technology skill group. What remains is Niceman Music Studio — deliberately
# framed as a built facility and a commercial business rather than an artist
# project, because on this résumé its job is to (a) cover 2012–2015 and (b) show
# someone who engineers physical systems and carries a P&L. SetMaster 3 keeps
# its slot as the Python/TypeScript application it is, described without the
# vendor names.
#
# Where the two résumés state the same fact they must state it identically —
# see verify_facts.py. Niceman in particular now appears on both, described two
# ways; the dates, the paying-client claim, and the publishing/licensing claim
# are the shared facts and must not drift.
# =============================================================================

